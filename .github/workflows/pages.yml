name: Deploy to GitHub Pages

# Deploys from ANY branch: cloud sessions push to their own claude/* branch,
# so the live site tracks the latest pushed work. The github-pages
# environment is configured to accept deployments from every branch.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_site: ${{ steps.site.outputs.has_site }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site (if there is one yet)
        id: site
        run: |
          set -e
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; fi
          fi
          for d in dist build out site; do
            if [ -f "$d/index.html" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"; echo "has_site=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          if [ -f index.html ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"; echo "has_site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "has_site=false" >> "$GITHUB_OUTPUT"
          echo "No site to deploy yet, so skipping."

      - if: steps.site.outputs.has_site == 'true'
        uses: actions/configure-pages@v5

      - if: steps.site.outputs.has_site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  deploy:
    needs: build
    if: needs.build.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
